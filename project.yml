name: SalBlox
options:
  bundleIdPrefix: xyz.justsal
  deploymentTarget: { iOS: "17.0" }
packages:
  SalBloxKit: { path: Packages/SalBloxKit }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SalBlox:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SalBloxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.Blox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Roblox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIColorName: LaunchBackground }
        UIAppFonts: [BuilderSans-Regular.otf, BuilderSans-Medium.otf, BuilderSans-Bold.otf, BuilderSans-ExtraBold.otf, BuilderIcons-Regular.ttf, BuilderIcons-Filled.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        BloxAPI: https://justsal.xyz/blox-api/KEY
  SalBloxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SalBlox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.BloxUITests
schemes:
  SalBlox:
    build:
      targets:
        SalBlox: all
    test:
      targets: [SalBloxUITests]
