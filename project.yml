name: Blox
options:
  bundleIdPrefix: xyz.justsal
  deploymentTarget: { iOS: "17.0" }
packages:
  BloxKit: { path: Packages/BloxKit }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Blox:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BloxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.Blox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Roblox Sim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIColorName: LaunchBackground }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  BloxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Blox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.BloxUITests
schemes:
  Blox:
    build:
      targets:
        Blox: all
    test:
      targets: [BloxUITests]
