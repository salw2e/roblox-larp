name: build
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "shots/**"]
  workflow_dispatch:
    inputs:
      redraw:
        description: "redraw the avatar for real (uses 2 of the 6 hourly renders)"
        type: boolean
        default: false
      skip_ui:
        description: "skip the ui test"
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: kit tests
        run: cd Packages/SalBloxKit && swift test
      - name: xcodegen
        run: brew install xcodegen && xcodegen generate
      - name: avatar key for the ui test
        if: ${{ !inputs.skip_ui }}
        run: |
          JWT=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=blox-api" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          KEY=$(curl -sf -X POST -H "Authorization: Bearer $JWT" https://justsal.xyz/blox-ci-key | python3 -c 'import json,sys; print(json.load(sys.stdin)["key"])')
          echo "::add-mask::$KEY"
          sed -i '' "s#/blox-api/KEY#/blox-api/$KEY#" project.yml && xcodegen generate
          echo "BLOX_KEY=$KEY" >> "$GITHUB_ENV"
      - name: ui test
        if: ${{ !inputs.skip_ui }}
        env:
          TEST_RUNNER_BLOX_TEST_REDRAW: ${{ inputs.redraw && '1' || '0' }}
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if ".iOS-" in k), key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")])
          phones = [x for x in d[ios[-1]] if x["name"].startswith("iPhone") and "Pro Max" in x["name"]] or [x for x in d[ios[-1]] if x["name"].startswith("iPhone")]
          print(phones[0]["udid"]); print(phones[0]["name"], ios[-1], file=sys.stderr)')
          xcodebuild test -project SalBlox.xcodeproj -scheme SalBlox -destination "id=$UDID" -resultBundlePath build/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-log.txt | grep -E "error:|Test Case|TEST (SUCCEEDED|FAILED)|XCTAssert" || true
          grep -q "TEST SUCCEEDED" test-log.txt
      - name: screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/shots || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: build/shots, retention-days: 14, if-no-files-found: ignore }
      - name: archive
        run: |
          set -o pipefail
          git checkout -- project.yml && xcodegen generate
          xcodebuild -project SalBlox.xcodeproj -scheme SalBlox -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/SalBlox.xcarchive \
            CURRENT_PROJECT_VERSION=$((${{ github.run_number }} + 100)) \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive 2>&1 | tee build-log.txt | grep -E "error:|warning: .*Swift|ARCHIVE" || true
          test -d build/SalBlox.xcarchive/Products/Applications/SalBlox.app
          test -f build/SalBlox.xcarchive/Products/Applications/SalBlox.app/Info.plist
          plutil -extract BloxAPI raw build/SalBlox.xcarchive/Products/Applications/SalBlox.app/Info.plist | grep -q '/blox-api/KEY$'
      - name: ipa
        run: |
          mkdir -p build/Payload && cp -R build/SalBlox.xcarchive/Products/Applications/SalBlox.app build/Payload/
          cd build && zip -qry SalBlox.ipa Payload && ls -la SalBlox.ipa
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: build/SalBlox.ipa, retention-days: 30 }
      - name: scrub key from logs
        if: failure()
        run: '[ -z "$BLOX_KEY" ] || sed -i "" "s#$BLOX_KEY#***#g" *-log.txt || true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: logs, path: "*-log.txt", retention-days: 7 }
